name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        env:
          APP_APP_NAME: "ExpanceTracker Test"
          APP_APP_VERSION: "1.0.0"
          APP_DEBUG: "true"
          APP_API_V1_PREFIX: "/api/v1"
          APP_DATABASE_URL: "sqlite:///./test_expance_tracker.db"
          APP_GEMINI_API_KEY: "fake_gemini_api_key_for_testing"
          APP_LLM_PROVIDER: "ollama"
          APP_LLM_MODEL: "llama3.2"
          APP_OLLAMA_BASE_URL: "http://localhost:11434"
        run: |
          cd backend
          python -m pytest
