services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgweb:
    image: sosedoff/pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable}
    depends_on:
      - db

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}}
      - APP_GEMINI_API_KEY
      - APP_LLM_PROVIDER
      - APP_LLM_MODEL
      - APP_OLLAMA_BASE_URL
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

  worker:
    build:
      context: .
      target: worker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - api
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}}
      - APP_GEMINI_API_KEY
      - APP_LLM_PROVIDER
      - APP_LLM_MODEL
      - APP_OLLAMA_BASE_URL
    command: rq worker default --url ${REDIS_URL:-redis://redis:6379/0}

volumes:
  pgdata:
