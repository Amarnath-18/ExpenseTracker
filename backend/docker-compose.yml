services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - db

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/postgres
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

  celery_worker:
    build:
      context: .
      target: worker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - api
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/postgres
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

volumes:
  pgdata:
